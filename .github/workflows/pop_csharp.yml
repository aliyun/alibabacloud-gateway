name: POP .NET Core

on:
  push:
    branches: [ master ]
    paths:
      - 'alibabacloud-gateway-pop/**'
      - '.github/workflows/pop_csharp.yml'
      - '.github/scripts/require_diff_coverage.py'
  pull_request:
    branches: [ master ]
    paths:
      - 'alibabacloud-gateway-pop/**'
      - '.github/workflows/pop_csharp.yml'
      - '.github/scripts/require_diff_coverage.py'
defaults:
  run:
    shell: bash
    working-directory: alibabacloud-gateway-pop/csharp
jobs:
  build:

    runs-on: ubuntu-20.04

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.x'
    - name: install altcover
      run: cd core/ && dotnet tool install --global altcover.visualizer --version 8.6.14
    - name: Install dependencies
      run: cd core/ && dotnet restore
    - name: Build
      run: cd core/ && dotnet build --configuration Release --no-restore
    - name: Test
      run: dotnet test tests/ /p:AltCover=true
    - name: Verify coverage report
      run: test -f tests/coverage.xml
    - name: Require 90% diff coverage
      if: github.event_name == 'pull_request'
      run: |
        git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.sha }}
        python3 "${{ github.workspace }}/.github/scripts/require_diff_coverage.py" \
          --base "${{ github.event.pull_request.base.sha }}" \
          --report tests/coverage.xml \
          --format cobertura \
          --minimum 90
    - uses: codecov/codecov-action@v4
      with:
        files: alibabacloud-gateway-pop/csharp/tests/coverage.xml
        flags: csharp
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false

