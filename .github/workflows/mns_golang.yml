name: MNS Go

on:
  push:
    branches: [ master ]
    paths:
      - 'alibabacloud-gateway-mns/**'
      - '.github/workflows/mns_golang.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'alibabacloud-gateway-mns/**'
      - '.github/workflows/mns_golang.yml'
permissions:
  contents: read
defaults:
  run:
    shell: bash
    working-directory: alibabacloud-gateway-mns/golang
jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.14", "1.16", "1.18", "1.20", "1.21"]
      fail-fast: false

    steps:
    - name: Set up Go 1.x
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go }}
    - name: Check out code into the Go module directory
      uses: actions/checkout@v4
    - name: Export Env
      run: export GO111MODULE=on
    - name: Build
      run: go mod tidy
    - name: Test
      run: go test -race -coverprofile=coverage.txt -covermode=atomic ./client/...
