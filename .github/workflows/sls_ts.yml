name: SLS Node.js CI

on:
  push:
    branches: [ master ]
    paths:
      - 'alibabacloud-gateway-sls/**'
      - '.github/workflows/sls_ts.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'alibabacloud-gateway-sls/**'
      - '.github/workflows/sls_ts.yml'

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: alibabacloud-gateway-sls/ts
jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [10.x, 12.x, 14.x, 16.x, 18.x, 20.x]
      fail-fast: false

    steps:
    - uses: actions/checkout@v2
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v1
      with:
        node-version: ${{ matrix.node-version }}
    - run: npm install
    - run: npm run test-cov
    - name: CodeCov
      run: bash <(curl -s https://codecov.io/bash) -cF ts
