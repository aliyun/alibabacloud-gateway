name: POP Go

on:
  push:
    branches: [ master ]
    paths:
      - 'alibabacloud-gateway-pop/**'
      - '.github/workflows/pop_golang.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'alibabacloud-gateway-pop/**'
      - '.github/workflows/pop_golang.yml'
defaults:
  run:
    shell: bash
    working-directory: alibabacloud-gateway-pop/golang
jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.13", "1.14", "1.15", "1.16", "1.17", "1.18", "1.19", "1.20", "1.21"]
      fail-fast: false

    steps:

    - name: Set up Go 1.x
      uses: actions/setup-go@v2
      with:
        go-version: ${{ matrix.go }}

    - name: Check out code into the Go module directory
      uses: actions/checkout@v2

    - name: Export Env
      run: export GO111MODULE=on
    - name: Tidy modules
      # Go 1.13 and 1.14 load tests of dependencies during tidy. tea-xml pulls
      # mxj, whose tests import go-cmp tests that reference net/netip (Go 1.18+).
      # The gateway itself builds and tests on these releases; tidy is not required for that.
      if: matrix.go != '1.13' && matrix.go != '1.14'
      run: go mod tidy
    - name: Test
      run: go test -mod=readonly -race -coverprofile=coverage.txt -covermode=atomic ./client/...
    - name: Verify coverage report
      run: test -f coverage.txt
    - uses: codecov/codecov-action@v4
      with:
        files: alibabacloud-gateway-pop/golang/coverage.txt
        flags: golang
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false