name: POP Python Test

on:
  push:
    branches: [ master ]
    paths:
      - 'alibabacloud-gateway-pop/**'
      - '.github/workflows/pop_python.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'alibabacloud-gateway-pop/**'
      - '.github/workflows/pop_python.yml'
defaults:
  run:
    shell: bash
    working-directory: alibabacloud-gateway-pop/python
jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
      fail-fast: false

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: pip install setuptools urllib3==1.26.20 'cryptography>=3.0.0, <45.0.0' 'darabonba-core>=1.0.8,<2.0.0' alibabacloud-tea alibabacloud_gateway_spi alibabacloud_tea_xml coverage pytest alibabacloud-credentials && python setup.py install
    - name: Test with unittest
      run: |
        coverage run -m unittest discover
        coverage xml -o coverage.xml
    - name: Verify coverage report
      run: test -f coverage.xml
    - uses: codecov/codecov-action@v4
      with:
        files: alibabacloud-gateway-pop/python/coverage.xml
        flags: python
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false