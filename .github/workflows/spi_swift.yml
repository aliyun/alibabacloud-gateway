name: SPI Swift

on:
  push:
    branches: [ master ]
    paths:
      - 'alibabacloud-gateway-spi/swift/**'
      - '.github/workflows/spi_swift.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'alibabacloud-gateway-spi/swift/**'
      - '.github/workflows/spi_swift.yml'

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: alibabacloud-gateway-spi/swift

jobs:
  macos:
    name: SPI Swift on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    steps:
    - name: Check out code
      uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Select Xcode 16.4
      if: matrix.os == 'macos-15'
      run: sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
    - name: Check out Swift integration dependencies
      if: github.event_name == 'pull_request' && github.event.pull_request.number == 184
      uses: actions/checkout@v4
      with:
        repository: aliyun/tea-swift
        ref: 51b0c3a5e7151cc6a1cd2b789d89b7e077cf2608
        path: .swift-ci/tea-swift
        persist-credentials: false
    - name: Prepare Swift integration dependencies
      if: github.event_name == 'pull_request' && github.event.pull_request.number == 184
      run: python3 "$GITHUB_WORKSPACE/.swift-ci/tea-swift/.github/scripts/prepare-swift-dependencies.py" "$GITHUB_WORKSPACE/alibabacloud-gateway-spi/swift"
    - name: Swift version
      run: swift --version
    - name: Build
      run: swift build

  linux:
    name: SPI Linux Swift ${{ matrix.swift }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        swift: ["5.7.3", "5.8.1", "5.9.2", "5.10.1", "6.0.3", "6.1.3", "6.2.4", "6.3.3", "6.4.0"]
    container: swift:${{ matrix.swift }}-jammy
    steps:
    - name: Check out code
      uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Check out Swift integration dependencies
      if: github.event_name == 'pull_request' && github.event.pull_request.number == 184
      uses: actions/checkout@v4
      with:
        repository: aliyun/tea-swift
        ref: 51b0c3a5e7151cc6a1cd2b789d89b7e077cf2608
        path: .swift-ci/tea-swift
        persist-credentials: false
    - name: Install Python for Swift 5.7 dependency preparation
      if: github.event_name == 'pull_request' && github.event.pull_request.number == 184 && startsWith(matrix.swift, '5.7.')
      run: apt-get update && apt-get install -y --no-install-recommends python3
    - name: Prepare Swift integration dependencies
      if: github.event_name == 'pull_request' && github.event.pull_request.number == 184
      run: python3 "$GITHUB_WORKSPACE/.swift-ci/tea-swift/.github/scripts/prepare-swift-dependencies.py" "$GITHUB_WORKSPACE/alibabacloud-gateway-spi/swift"
    - name: Swift version
      run: swift --version
    - name: Build
      if: ${{ !startsWith(matrix.swift, '5.7.') }}
      run: swift build
    - name: Verify Swift 5.7 is unsupported on Linux
      if: startsWith(matrix.swift, '5.7.')
      run: |
        if swift build > swift-test.log 2>&1; then
          cat swift-test.log
          exit 1
        fi
        cat swift-test.log
        grep -F "error: Tea on Linux requires Swift 5.8 or later." swift-test.log
